name: Build FluxConvert - Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Visual Studio Build Tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm install

      - name: Download FFmpeg for Windows
        run: |
          $pkg = "ffmpeg-8.1.2-essentials_build.zip"
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/$pkg"
          $tempDir = "$env:TEMP\ffmpeg-win"
          
          # Create temp directory if it doesn't exist
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          
          try {
            Write-Host "Downloading FFmpeg from gyan.dev..."
            Invoke-WebRequest -Uri $url -OutFile "$($tempDir)\$pkg" -UseBasicParsing
            
            # Verify download succeeded
            if (-not (Test-Path "$($tempDir)\$pkg")) {
              Write-Error "Download failed - file not created at $($tempDir)\$pkg"
              exit 1
            }
            
            Write-Host "Extracting archives..."
            Expand-Archive -Path "$($tempDir)\$pkg" -DestinationPath $tempDir -Force
            
            # Find the extracted ffmpeg folder (named something like 'ffmpeg-8.1.2-essentials')
            $binSrc = Get-ChildItem -Path $tempDir -Directory -Filter "ffmpeg-*" | Select-Object -First 1
            
            if ($binSrc) {
              Write-Host "Found ffmpeg folder: $($binSrc.FullName)"
              
              Copy-Item "$($binSrc.FullName)\bin\ffmpeg.exe" "src-tauri\binaries\ffmpeg.exe" -Force
              Copy-Item "$($binSrc.FullName)\bin\ffprobe.exe" "src-tauri\binaries\ffprobe.exe" -Force
              Write-Host "FFmpeg installed successfully to src-tauri/binaries/"
              
              # Verify files exist and are valid
              $ffmpegSize = (Get-Item "src-tauri\binaries\ffmpeg.exe").Length
              $ffprobeSize = (Get-Item "src-tauri\binaries\ffprobe.exe").Length
              
              if ($ffmpegSize -lt 1MB -or $ffprobeSize -lt 1MB) {
                Write-Error "Downloaded binaries appear corrupted or too small"
                exit 1
              }
              
              Write-Host "Binary sizes - ffmpeg: $($ffmpegSize/1MB) MB, ffprobe: $($ffprobeSize/1MB) MB"
            } else {
              Write-Error "Could not find extracted ffmpeg folder in temp dir"
              Write-Error "Contents of $tempDir"
              Get-ChildItem -Path $tempDir -Force | Select-Object Name, Length
              exit 1
            }
          } catch {
            Write-Error "Failed to download FFmpeg: $_"
            Write-Error "URL tried: $url"
            Write-Error "Temp dir: $tempDir"
            exit 1
          }

      - name: Install Node.js dependencies
        shell: pwsh
        run: npm install

      - name: Build Tauri Application (Windows)
        shell: pwsh
        run: |
          cd src-tauri
          npm run tauri build 2>&1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fluxconvert-windows
          path: |
            src-tauri/target/release/bundle/exe/FluxConvert.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/exe/FluxConvert.exe
            src-tauri/target/release/bundle/msi/*.msi
          body_path: src-tauri/windows/README.md

  test-windows:
    name: Test Windows Build
    runs-on: windows-latest
    needs: build-windows
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: fluxconvert-windows
          path: test-build/

      - name: Verify files
        run: |
          Write-Host "Checking build files..."
          Test-Path test-build/FluxConvert.exe
          Test-Path test-build/ffmpeg.exe
          Test-Path test-build/ffprobe.exe

      - name: Test FFmpeg
        run: |
          & .\test-build\ffmpeg.exe -version | Select-String "ffmpeg version"
          & .\test-build\ffprobe.exe -version | Select-String "ffprobe version"
