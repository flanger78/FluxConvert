name: Build FluxConvert - Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Visual Studio Build Tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm install

      - name: Download FFmpeg for Windows
        shell: pwsh
        run: |
          $pkg = "ffmpeg-8.1.2-essentials_build.zip"
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/$pkg"
          $tempDir = "$env:TEMP\ffmpeg-win"
          $triple = "x86_64-pc-windows-msvc"

          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null

          try {
            Write-Host "Downloading FFmpeg from gyan.dev..."
            Invoke-WebRequest -Uri $url -OutFile "$($tempDir)\$pkg" -UseBasicParsing

            if (-not (Test-Path "$($tempDir)\$pkg")) {
              Write-Error "Download failed - file not created at $($tempDir)\$pkg"
              exit 1
            }

            Write-Host "Extracting archives..."
            Expand-Archive -Path "$($tempDir)\$pkg" -DestinationPath $tempDir -Force

            $binSrc = Get-ChildItem -Path $tempDir -Directory -Filter "ffmpeg-*" | Select-Object -First 1

            if ($binSrc) {
              Write-Host "Found ffmpeg folder: $($binSrc.FullName)"

              # O Tauri exige o sufixo da target triple em binarios externos
              Copy-Item "$($binSrc.FullName)\bin\ffmpeg.exe" "src-tauri\binaries\ffmpeg-$($triple).exe" -Force
              Copy-Item "$($binSrc.FullName)\bin\ffprobe.exe" "src-tauri\binaries\ffprobe-$($triple).exe" -Force
              # Copia simples tambem (fallback de runtime e scripts de instalacao)
              Copy-Item "$($binSrc.FullName)\bin\ffmpeg.exe" "src-tauri\binaries\ffmpeg.exe" -Force
              Copy-Item "$($binSrc.FullName)\bin\ffprobe.exe" "src-tauri\binaries\ffprobe.exe" -Force
              Write-Host "FFmpeg installed successfully to src-tauri/binaries/"

              $ffmpegSize = (Get-Item "src-tauri\binaries\ffmpeg-$($triple).exe").Length
              $ffprobeSize = (Get-Item "src-tauri\binaries\ffprobe-$($triple).exe").Length

              if ($ffmpegSize -lt 1MB -or $ffprobeSize -lt 1MB) {
                Write-Error "Downloaded binaries appear corrupted or too small"
                exit 1
              }

              Write-Host "Binary sizes - ffmpeg: $([math]::Round($ffmpegSize/1MB)) MB, ffprobe: $([math]::Round($ffprobeSize/1MB)) MB"
            } else {
              Write-Error "Could not find extracted ffmpeg folder in temp dir"
              Get-ChildItem -Path $tempDir -Force | Select-Object Name, Length
              exit 1
            }
          } catch {
            Write-Error "Failed to download FFmpeg: $_"
            Write-Error "URL tried: $url"
            exit 1
          }

      - name: Build Tauri Application (Windows)
        shell: pwsh
        run: npm run tauri build

      - name: List installer outputs
        shell: pwsh
        run: |
          Write-Host "NSIS installers:"
          Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" -Filter *.exe -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Write-Host "MSI installers:"
          Get-ChildItem -Path "src-tauri\target\release\bundle\msi" -Filter *.msi -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fluxconvert-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          body_path: src-tauri/windows/README.md

  test-windows:
    name: Test Windows Build
    runs-on: windows-latest
    needs: build-windows
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: fluxconvert-windows
          path: test-build/

      - name: Verify installer files
        shell: pwsh
        run: |
          Write-Host "Checking installer files..."
          $nsis = Get-ChildItem -Path test-build -Filter *.exe -Recurse -ErrorAction SilentlyContinue
          $msi = Get-ChildItem -Path test-build -Filter *.msi -Recurse -ErrorAction SilentlyContinue
          if (-not $nsis -and -not $msi) {
            Write-Error "Nenhum instalador (.exe/.msi) encontrado no artifact"
            exit 1
          }
          $nsis | ForEach-Object { Write-Host "OK NSIS: $($_.FullName) ($([math]::Round($_.Length/1MB)) MB)" }
          $msi | ForEach-Object { Write-Host "OK MSI: $($_.FullName) ($([math]::Round($_.Length/1MB)) MB)" }
